<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cognitive science experiment</title>
    
    <style>
        body {
            background-color: #808080;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        #jspsych-target {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .jspsych-content {
            max-width: 1200px;
            padding: 40px;
            text-align: center;
        }
        
        .shape-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
            gap: 100px;
        }
        
        .shape {
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* Carré */
        .shape-square {
            width: 130px;
            height: 130px;
        }
        
        /* Triangle */
        .shape-triangle {
            width: 0;
            height: 0;
            border-left: 75px solid transparent;
            border-right: 75px solid transparent;
            border-bottom: 130px solid;
        }
        
        /* Rond (Cercle) */
        .shape-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
        }
        
        /* Étoile */
        .shape-star {
            width: 150px;
            height: 150px;
            clip-path: polygon(
                50% 0%, 61% 35%, 98% 35%, 68% 57%, 
                79% 91%, 50% 70%, 21% 91%, 32% 57%, 
                2% 35%, 39% 35%
            );
        }
        
        /* Losange */
        .shape-diamond {
            width: 106px;
            height: 106px;
            transform: rotate(45deg);
        }
        
        .fixation {
            font-size: 48px;
            color: white;
        }
        
        .feedback-correct {
            color: #00C853;
            font-size: 36px;
            font-weight: bold;
        }
        
        .feedback-incorrect {
            color: #EF5350;
            font-size: 36px;
            font-weight: bold;
        }

        .jaune {
            color: #FFE066;
            font-weight: 600;
        }

        .orange {
            color: #FFAA44;
            font-weight: 600;
        }
        
        .instruction-text {
            font-size: 20px;
            line-height: 1.8;
            text-align: left;
            color: white;
        }
        
        .instruction-text h2 {
            text-align: center;
        }
        
        .instruction-text ul {
            text-align: left;
            margin: 5px auto;
            max-width: 600px;
        }

        .instruction-text p {
            margin: 4px 0;
        }
        
        .block-feedback {
            font-size: 24px;
            line-height: 1.8;
            color: white;
        }
        
        input[type="text"] {
            padding: 12px;
            font-size: 16px;
            margin: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 200px;
        }
        
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        .arrow {
            font-size: 120px;
            color: white;
        }
        
        .key-hint {
            margin-top: 30px;
            font-size: 20px;
            color: white;
        }
        
        .single-stimulus {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
        }

        /* Loading spinner */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script>
        // ====================================================================
        // CONFIGURATION FIREBASE
        // ====================================================================
        
        // VRAIES VALEURS FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCgG--PjinwSrEbd0Xg5kMP_foGDg06LUs",
            authDomain: "m2-thesis.firebaseapp.com",
            databaseURL: "https://m2-thesis-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "m2-thesis",
            storageBucket: "m2-thesis.firebasestorage.app",
            messagingSenderId: "162116586503",
            appId: "1:162116586503:web:75358e3bcde792c0176ea2"
        };
        
        // Initialise Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // ====================================================================
        // VARIABLES GLOBALES
        // ====================================================================
        
        let participantId = '';
        let sessionId = '';
        let ruleOrder = [];
        let accuracyWindow = [];
        let allData = [];
        let learningTrials = [];
        let currentLearningTrial = 0;
        let currentBlock = 0;
        let currentTestTrial = 0;
        let testTrials = [];
        
        const LEARNING_ACCURACY_THRESHOLD = 0.90;
        const LEARNING_WINDOW_SIZE = 10;
        const MIN_LEARNING_TRIALS = 52; 
        const TEST_BLOCKS = 4;
        const TRIALS_PER_BLOCK = 70;
        const STIMULUS_DURATION = 2000;
        const RT_MIN = 0;
        const RT_MAX = 2000;
        
        const PRACTICE_TRIALS_COUNT = 10;
        const DEBUG_MODE = false;
        
        const SHAPES_POOL = [
            { type: 'square', color: '#FF7A1A', name: 'carré orange' },
            { type: 'triangle', color: '#0CF0FF', name: 'triangle bleu' },
            { type: 'circle', color: '#00D45A', name: 'rond vert' },
            { type: 'star', color: '#FFE000', name: 'étoile jaune' },
            { type: 'diamond', color: '#AA22CC', name: 'losange violet' }
        ];
        let SHAPES = [];
        let shapeOrder = [];

       // small_condition = direction de la flèche GO quand les perdants (small) sont GO
       // large_condition = direction de la flèche GO quand les gagnants (large) sont GO
       // NB : small est TOUJOURS à gauche et large TOUJOURS à droite sur la ligne mentale,
       // ces champs indiquent seulement quelle flèche est GO dans ce bloc

        
        const RESPONSE_RULES = {
            1: { 
                small_condition: 'left', 
                large_condition: 'right',
                instruction: 'Appuyez sur ESPACE si :<br><br>• La forme présentée <strong><span class="jaune">PERD</span></strong> face à la référence<br>OU<br>• La flèche présentée pointe vers la <strong><span class="jaune">GAUCHE</span></strong><br><br>Sinon, ne faites RIEN'
            },
            2: { 
                small_condition: 'right', 
                large_condition: 'left',
                instruction: 'Appuyez sur ESPACE si :<br><br>• La forme présentée <strong><span class="jaune">PERD</span></strong> face à la référence<br>OU<br>• La flèche présentée pointe vers la <strong><span class="jaune">DROITE</span></strong><br><br>Sinon, ne faites RIEN'
            },
            3: { 
                small_condition: 'right', 
                large_condition: 'right',
                instruction: 'Appuyez sur ESPACE si :<br><br>• La forme présentée <strong><span class="jaune">GAGNE</span></strong> face à la référence<br>OU<br>• La flèche présentée pointe vers la <strong><span class="jaune">DROITE</span></strong><br><br>Sinon, ne faites RIEN'
            },
            4: { 
                small_condition: 'left', 
                large_condition: 'left',
                instruction: 'Appuyez sur ESPACE si :<br><br>• La forme présentée <strong><span class="jaune">GAGNE</span></strong> face à la référence<br>OU<br>• La flèche présentée pointe vers la <strong><span class="jaune">GAUCHE</span></strong><br><br>Sinon, ne faites RIEN'
            }
        };
        
        // ====================================================================
        // FONCTIONS UTILITAIRES
        // ====================================================================
        
        function createShapeHTML(shapeIndex) {
            const shape = SHAPES[shapeIndex];
            
            if (shape.type === 'triangle') {
                return `<div class="shape shape-${shape.type}" style="border-bottom-color: ${shape.color};"></div>`;
            }
            
            return `<div class="shape shape-${shape.type}" style="background-color: ${shape.color};"></div>`;
        }
        
        function createPairHTML(leftIndex, rightIndex) {
            return `
                <div class="shape-container">
                    <div>${createShapeHTML(leftIndex)}</div>
                    <div>${createShapeHTML(rightIndex)}</div>
                </div>
                <div class="key-hint">
                    <span style="margin-right: 80px;">Appuyez sur <strong>Q</strong> pour GAUCHE</span>
                    <span style="margin-left: 80px;">Appuyez sur <strong>M</strong> pour DROITE</span>
                </div>
            `;
        }
        
        function createSingleStimulusHTML(stimulusType, stimulusIndex) {
            if (stimulusType === 'shape') {
                return `<div class="single-stimulus">${createShapeHTML(stimulusIndex)}</div>`;
            } else {
                const arrowSymbol = stimulusIndex === 'left' ? '←' : '→';
                return `<div class="single-stimulus"><span class="arrow">${arrowSymbol}</span></div>`;
            }
        }
        
        function calculateRollingAccuracy() {
            if (accuracyWindow.length < LEARNING_WINDOW_SIZE) return null;
            const sum = accuracyWindow.slice(-LEARNING_WINDOW_SIZE).reduce((a, b) => a + b, 0);
            return sum / LEARNING_WINDOW_SIZE;
        }
        
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function initializeShapeOrder() {
            SHAPES = shuffleArray(SHAPES_POOL);
            shapeOrder = SHAPES.map(s => s.type);
        }

        function showDebugBanner() {
            if (!DEBUG_MODE) return;
            const old = document.getElementById('debug-banner');
            if (old) old.remove();
            const banner = document.createElement('div');
            banner.id = 'debug-banner';
            banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:rgba(255,0,0,0.85);color:white;padding:8px 15px;font-size:13px;z-index:9999;font-family:monospace;';
            // Affiche dans l'ordre croissant de magnitude (small à gauche → large à droite)
            // Magnitude 1 (small/gauche) = perd contre tout le monde
            // Magnitude 5 (large/droite) = gagne contre tout le monde
            banner.innerHTML = '⚠️ DEBUG | Hiérarchie (perd → gagne): '
                + SHAPES.map((s, i) => {
                    const magnitude = i + 1;
                    const label = i === 2 ? '(REF)' : (i < 2 ? '(perd)' : '(gagne)');
                    return 'M' + magnitude + ' ' + label + ': ' + s.name;
                }).join(' → ')
                + ' | Règles: [' + ruleOrder.join(',') + ']';
            document.body.prepend(banner);
        }
        
        function createLearningTrials() {
            const pairs = [[0, 1], [1, 2], [2, 3], [3, 4]];
            let trials = [];
            
            pairs.forEach(pair => {
                for (let i = 0; i < 13; i++) {
                    if (Math.random() < 0.5) {
                        trials.push({
                            left_item: pair[0],
                            right_item: pair[1],
                            correct_response: 'm'  // ✅ pair[1] = index plus grand = gagnant = droite
                        });
                    } else {
                        trials.push({
                            left_item: pair[1],
                            right_item: pair[0],
                            correct_response: 'q'  // ✅ pair[1] = index plus grand = gagnant = gauche
                        });
                    }
                }
            });
            
            return shuffleArray(trials);
        }
        
        function createTestTrials(ruleCondition) {
            const rule = RESPONSE_RULES[ruleCondition];
            const referenceIdx = 2;
            let trials = [];


            // Détermine quelle magnitude doit être "go" selon la règle :
            // Règles 1, 2 : GO si PERD → perdants = indices 0,1 = magnitude "small"
            // Règles 3, 4 : GO si GAGNE → gagnants = indices 3,4 = magnitude "large"
            
            // Détermine quelle magnitude doit être "go" selon la règle: 
            // Si la règle est 1 ou 2 (GO quand la forme PERD) → goMagnitude = 'small' → les formes qui perdent (indices 0, 1)
            // Sinon (règle 3 ou 4, GO quand la forme GAGNE) → goMagnitude = 'large' → les formes qui gagnent (indices 3, 4)
            const goMagnitude = (ruleCondition === 1 || ruleCondition === 2) ? 'small' : 'large';


                // --- ESSAIS FORMES ---
                // Pour chaque forme (sauf la référence), on détermine :
                // 1) Sa magnitude (small ou large) selon sa position dans la hiérarchie
                // 2) Si c'est un essai GO ou NOGO (selon goMagnitude)
                // 3) Sa congruence SNARC (small+gauche ou large+droite = congruent)

                // --- ESSAIS FLÈCHES ---
                // La flèche est GO si sa direction correspond à la condition de la magnitude GO.
                // Ex: Règle 1 → goMagnitude = small → small_condition = 'left' → flèche gauche = GO
                // Congruence des flèches : gauche = congruent (associé à small), droite = incongruent
            
            // Créer les essais avec les formes
            for (let shapeIdx = 0; shapeIdx < 5; shapeIdx++) {
                if (shapeIdx === referenceIdx) continue;
                
                const magnitude = shapeIdx < referenceIdx ? 'small' : 'large';
                const arrowDirForGo = magnitude === 'small' ? rule.small_condition : rule.large_condition;
                
                const congruency = 
                    (magnitude === 'small' && arrowDirForGo === 'left') ||
                    (magnitude === 'large' && arrowDirForGo === 'right')
                    ? 'congruent' : 'incongruent';
                
                // Détermine si c'est go ou nogo selon la magnitude
                // Si la magnitude de la forme présentée correspond à goMagnitude, le participant doit appuyer (go), sinon il ne fait rien (nogo).
                const correctResponse = magnitude === goMagnitude ? 'go' : 'nogo';
                
                trials.push({
                    stimulus_type: 'shape',
                    stimulus_idx: shapeIdx,
                    magnitude: magnitude,
                    correct_response: correctResponse,  // 
                    congruency: congruency
                });
            }
            
            // Créer les essais avec les flèches (reste identique)
            ['left', 'right'].forEach(arrowDir => {
                const isGoSmall = arrowDir === rule.small_condition;
                const isGoLarge = arrowDir === rule.large_condition;
                
                // Détermine quelle magnitude doit être "go" pour ce bloc
                const goMagnitude = (ruleCondition === 1 || ruleCondition === 2) ? 'small' : 'large';
                
                let correctResponse, congruency;
                
                // La flèche est GO seulement si elle correspond à la magnitude GO
                if ((goMagnitude === 'small' && isGoSmall) || (goMagnitude === 'large' && isGoLarge)) {
                    correctResponse = 'go';
                    // Congruence : flèche gauche = congruent avec small, droite = congruent avec large
                    congruency = ((arrowDir === 'left' && goMagnitude === 'small') || 
                                  (arrowDir === 'right' && goMagnitude === 'large'))
                                 ? 'congruent' : 'incongruent';
                } else {
                    correctResponse = 'nogo';
                    congruency = 'nogo';
                }   
                
                trials.push({
                    stimulus_type: 'arrow',
                    stimulus_idx: arrowDir,
                    magnitude: 'n/a',
                    correct_response: correctResponse,
                    congruency: congruency
                });
            });
            
            // Répéter pour avoir 72 essais (12 répétitions de 6 stimuli)
            const repeatedTrials = [];
            for (let i = 0; i < 12; i++) {
                repeatedTrials.push(...trials);
            }
    
            return shuffleArray(repeatedTrials);
        }

        function createPracticeTrials(ruleCondition) {
            const rule = RESPONSE_RULES[ruleCondition];
            const goMagnitude = (ruleCondition === 1 || ruleCondition === 2) ? 'small' : 'large';
            let trials = [];
        
            for (let shapeIdx = 0; shapeIdx < 5; shapeIdx++) {
                if (shapeIdx === 2) continue;
                const magnitude = shapeIdx < 2 ? 'small' : 'large';
                trials.push({
                    stimulus_type: 'shape',
                    stimulus_idx: shapeIdx,
                    correct_response: magnitude === goMagnitude ? 'go' : 'nogo'
                });
            }
        
            ['left', 'right'].forEach(arrowDir => {
                const isGoSmall = arrowDir === rule.small_condition;
                const isGoLarge = arrowDir === rule.large_condition;
                trials.push({
                    stimulus_type: 'arrow',
                    stimulus_idx: arrowDir,
                    correct_response:
                        (goMagnitude === 'small' && isGoSmall) || (goMagnitude === 'large' && isGoLarge)
                        ? 'go' : 'nogo'
                });
            });
        
            const repeated = [];
            while (repeated.length < PRACTICE_TRIALS_COUNT) {
                repeated.push(...shuffleArray(trials));
            }
            return repeated.slice(0, PRACTICE_TRIALS_COUNT);
        }

        function showPracticeBlock(ruleCondition, onComplete) {
            const practiceTrials = createPracticeTrials(ruleCondition);
            let currentPracticeTrial = 0;
        
            function runNextTrial() {
                if (currentPracticeTrial >= practiceTrials.length) {
                    showScreen(`
                        <div class="block-feedback">
                            <h2>Entraînement terminé !</h2>
                            <p>La vraie tâche va commencer.<br>
                            <strong>Il n'y aura plus de feedback.</strong></p>
                            <br>
                            <p>Appuyez sur <strong>ESPACE</strong> pour commencer</p>
                            <p>Appuyez sur <strong>R</strong> pour recommencer l'entraînement</p>
                        </div>
                    `);
                    document.addEventListener('keydown', function spaceOrRetry(e) {
                        if (e.key === ' ') {
                            document.removeEventListener('keydown', spaceOrRetry);
                            onComplete();
                        } else if (e.key === 'r' || e.key === 'R') {
                            document.removeEventListener('keydown', spaceOrRetry);
                            showPracticeBlock(ruleCondition, onComplete);
                        }
                    });
                    return;
                }
        
                const trial = practiceTrials[currentPracticeTrial];
                showScreen(createSingleStimulusHTML(trial.stimulus_type, trial.stimulus_idx));
        
                const trialStart = Date.now();
                let responded = false;
        
                function handleResponse(e) {
                    if (e.key === ' ' && !responded) {
                        responded = true;
                        document.removeEventListener('keydown', handleResponse);
                        const correct = trial.correct_response === 'go';
                        currentPracticeTrial++;
                        showPracticeFeedback(correct, runNextTrial);
                    }
                }
        
                document.addEventListener('keydown', handleResponse);
        
                setTimeout(() => {
                    if (!responded) {
                        document.removeEventListener('keydown', handleResponse);
                        const correct = trial.correct_response === 'nogo';
                        currentPracticeTrial++;
                        showPracticeFeedback(correct, runNextTrial);
                    }
                }, STIMULUS_DURATION);
            }
        
                // Écran d'intro de l'entraînement
                // Écran d'intro de l'entraînement avec les mêmes consignes que le bloc
                const rule = RESPONSE_RULES[ruleCondition];
                const referenceShapeHTML = createShapeHTML(2);
                const referenceName = SHAPES[2].name;
                
                showScreen(`
                    <div class="instruction-text">
                        <h2>ENTRAÎNEMENT — CONSIGNES</h2>
                        <div style="text-align: center; margin: 5px 0;">
                            <p style="font-size: 20px; margin-bottom: 5px;"><strong>Forme de référence :</strong></p>
                            <div style="display: flex; justify-content: center; height: 160px; align-items: center;">
                                ${referenceShapeHTML}
                            </div>
                        </div>
                        <br>
                        <p style="font-size: 20px; text-align: center;">${rule.instruction}</p>
                        <br>
                        <p>Vous allez réaliser <strong><span class="jaune">${PRACTICE_TRIALS_COUNT} essais d'entraînement</span></strong> avec feedback pour vous familiariser avec la tâche.</p>
                        <br>
                        <p style="text-align: center;">Appuyez sur <strong>ESPACE</strong> pour démarrer l'entraînement</p>
                    </div>
                `);
                document.addEventListener('keydown', function spacePractice(e) {
                    if (e.key === ' ') {
                        document.removeEventListener('keydown', spacePractice);
                        showFixation(runNextTrial);
                    }
                });
            }

                function showPracticeFeedback(correct, callback) {
                    const feedbackClass = correct ? 'feedback-correct' : 'feedback-incorrect';
                    const feedbackText = correct ? '✅ Correct !' : '❌ Incorrect';
                    showScreen(`<div class="${feedbackClass}">${feedbackText}</div>`);
                    setTimeout(callback, 800);
                }
                
                function showScreen(html) {
                    const target = document.getElementById('jspsych-target');
                    target.innerHTML = `<div class="jspsych-content">${html}</div>`;
                }
         
        
        // ====================================================================
        // PHASE D'APPRENTISSAGE
        // ====================================================================
        
        function showParticipantInfo() {
            showScreen(`
                <div class="instruction-text" style="text-align: center;">
                    <h2>Expérience en psychologie cognitive</h2>
                    <h3>Bienvenue !</h3>
                    <p> Cette expérience est réalisée dans le cadre de mon mémoire de M2 du Master Economie et Psychologie (Paris 1 Panthéon-Sorbonne & Paris Cité), supervisé par André Knops. À la fin de l’expérience, il vous sera demandé de répondre à un bref questionnaire démographique. Les données récoltées sont anonymes et utilisées uniquement à des fins de recherche. L'expérience dure une vingtaine de minutes, et nécessite un clavier d'ordinateur. </p>
                    <br>
                    <p> Pour toutes questions relatives à cette expérience, vous pouvez me contacter à l'adresse suivante : Nelly.Adam@etu.univ-paris1.fr </p>
                    <br><br>
                    <button onclick="startExperiment()">Commencer l'expérience</button>
                </div>
            `);
        }

        
        function startExperiment() {
            sessionId = '001';
            window.experimentStartTime = Date.now();
        
            // Lit le compteur dans Firebase, l'incrémente, et démarre
            const counterRef = database.ref('participant_counter');
            counterRef.transaction(function(currentValue) {
                return (currentValue || 0) + 1;
            }).then(function(result) {
                const num = result.snapshot.val();
                participantId = 'P' + String(num).padStart(3, '0'); // → P001, P002, etc.
        
                const orderIndex = (num - 1) % 4;
                const orders = [
                    [1, 2, 3, 4],
                    [2, 3, 4, 1],
                    [3, 4, 1, 2],
                    [4, 1, 2, 3]
                ];
                ruleOrder = orders[orderIndex];
                initializeShapeOrder();
                database.ref('participants/' + participantId + '/shape_order')
                    .set(SHAPES.map((s, i) => ({
                        position: i,
                        type: s.type,
                        color: s.color,
                        name: s.name,
                        magnitude: i + 1
                    })))
                    .catch(err => console.error("Erreur sauvegarde shape_order:", err));
                showDebugBanner();
        
                showLearningInstructions();
            }).catch(function(error) {
                console.error("Erreur compteur Firebase:", error);
                // Fallback en cas d'erreur réseau
                participantId = 'P_' + Date.now();
                ruleOrder = [1, 2, 3, 4];
                initializeShapeOrder();
                database.ref('participants/' + participantId + '/shape_order')
                    .set(SHAPES.map((s, i) => ({
                        position: i,
                        type: s.type,
                        color: s.color,
                        name: s.name,
                        magnitude: i + 1
                    })))
                    .catch(err => console.error("Erreur sauvegarde shape_order:", err));
                showDebugBanner();
                showLearningInstructions();
            });
        }

        function showDemographics() {
            showScreen(`
                <div class="instruction-text">
                    <h2>Informations démographiques</h2>
                    <p>Merci de remplir les champs suivants.</p>
                    <br>
        
                    <label><strong>Âge :</strong></label><br>
                    <input type="number" id="demo-age" min="18" max="99" placeholder="ex: 23"
                        style="width: 100px; margin: 5px 0 20px 0;"><br>
        
                    <label><strong>Genre :</strong></label><br>
                    <div style="margin: 10px 0 20px 0;">
                        <label><input type="radio" name="genre" value="femme"> Femme</label>&nbsp;&nbsp;
                        <label><input type="radio" name="genre" value="homme"> Homme</label>&nbsp;&nbsp;
                        <label><input type="radio" name="genre" value="autre"> Autre / ne se prononce pas</label>
                    </div>
        
                    <label><strong>Dextérité :</strong></label><br>
                    <div style="margin: 10px 0 20px 0;">
                        <label><input type="radio" name="dexterite" value="droitier"> Droitier(e)</label>&nbsp;&nbsp;
                        <label><input type="radio" name="dexterite" value="gaucher"> Gaucher(e)</label>&nbsp;&nbsp;
                        <label><input type="radio" name="dexterite" value="ambidextre"> Ambidextre</label>
                    </div>
        
                    <label><strong>Sens d'apprentissage de la lecture/écriture :</strong></label><br>
                    <div style="margin: 10px 0 20px 0;">
                        <label><input type="radio" name="lecture" value="gauche_droite"> Gauche → Droite (ex: français, anglais)</label><br>
                        <label><input type="radio" name="lecture" value="droite_gauche"> Droite → Gauche (ex: arabe, hébreu)</label><br>
                        <label><input type="radio" name="lecture" value="les_deux"> Les deux (bilingue)</label>
                    </div>
        
                    <br>
                    <div style="text-align: center;">
                        <button onclick="submitDemographics()">Continuer</button>
                    </div>
                </div>
            `);
        }
        
        function submitDemographics() {
            const age = document.getElementById('demo-age').value;
            const genre = document.querySelector('input[name="genre"]:checked');
            const dexterite = document.querySelector('input[name="dexterite"]:checked');
            const lecture = document.querySelector('input[name="lecture"]:checked');
        
            if (!age || !genre || !dexterite || !lecture) {
                alert('Merci de remplir tous les champs avant de continuer.');
                return;
            }
        
            const demoData = {
                age: parseInt(age),
                genre: genre.value,
                dexterite: dexterite.value,
                sens_lecture: lecture.value
            };
        
            database.ref('participants/' + participantId + '/demographics')
                .set(demoData)
                .catch(err => console.error("Erreur sauvegarde demographics:", err));
        
            database.ref('completed_counter').transaction(cv => (cv || 0) + 1)
                .catch(err => console.error("Erreur completed_counter:", err));
        
            allData.push({ task: 'demographics', participant: participantId, ...demoData });
        
            showScreen(`
                <div class="block-feedback">
                    <h1>Merci pour votre participation !</h1>
                    <p>Vos données ont été sauvegardées avec succès.</p>
                    <br>
                    <p style="font-size: 18px;">Vous pouvez maintenant fermer cette fenêtre.</p>
                </div>
            `);
        }
        
        function showLearningInstructions() {
            showScreen(`
                <div class="instruction-text">
                    <h2>PHASE D'APPRENTISSAGE</h2>
                    <p>Deux formes colorées vont s'afficher à l'écran.</p>
                    <p>L'objectif : <strong><span class="jaune">apprendre quelle forme gagne par rapport à l'autre dans chaque paire.</span></strong> Vous devez sélectionner la forme que vous pensez être gagnante pour chaque paire présentée.</p>
                    <br>
                    <p style="text-align: center;">Appuyez sur <strong><span class="jaune">'Q'</span></strong> pour choisir la forme de <strong><span class="jaune">GAUCHE</span></strong></p>
                    <p style="text-align: center;">Appuyez sur <strong><span class="jaune">'M'</span></strong> pour choisir la forme de <strong><span class="jaune">DROITE</span></strong></p>
                    <br>
                    <p>Lors de cette phase, vous recevrez un <span class="jaune">feedback après chaque choix</span> (correct/incorrect). Au fur à à mesure des essais, cela vous permettra de <span class="jaune">déduire la forme gagnante</span> au sein de chaque paire. Ne soyez pas découragé(e) par vos erreurs, c'est le coeur du processus d'apprentissage ! </p>
                    <br>
                    <p>Après une phase d'entraînement obligatoire, l'apprentissage se terminera automatiquement dès que vous atteindrez 90% de réussite sur les 10 derniers essais.</p>
                    <br>
                    <p style="text-align: center;">Appuyez sur <strong>ESPACE</strong> pour commencer</p>
                </div>
            `);
            
            document.addEventListener('keydown', function spaceStart(e) {
                if (e.key === ' ') {
                    document.removeEventListener('keydown', spaceStart);
                    startLearning();
                }
            });
        }
        
        function startLearning() {
            learningTrials = createLearningTrials();
            currentLearningTrial = 0;

            if (DEBUG_MODE) {
                document.addEventListener('keydown', function skipLearning(e) {
                    if (e.key === 's' || e.key === 'S') {
                        document.removeEventListener('keydown', skipLearning);
                        showLearningComplete();
                    }
                });
            }
            
            showFixation(() => showLearningTrial());
        }
        
        function showFixation(callback) {
            showScreen('<div class="fixation">+</div>');
            setTimeout(callback, 500);
        }
        
        function showLearningTrial() {
            if (currentLearningTrial >= learningTrials.length) {
                const accuracy = calculateRollingAccuracy();
                const enoughTrials = accuracyWindow.length >= MIN_LEARNING_TRIALS;
                if (enoughTrials && accuracy !== null && accuracy >= LEARNING_ACCURACY_THRESHOLD) {
                    showLearningComplete();
                } else {
                    learningTrials = createLearningTrials();
                    currentLearningTrial = 0;
                    showFixation(() => showLearningTrial());
                }
                return;
            }
                
            const trial = learningTrials[currentLearningTrial];
            showScreen(createPairHTML(trial.left_item, trial.right_item));
            
            const trialStart = Date.now();
            
            function handleResponse(e) {
                if (e.key === 'q' || e.key === 'm') {
                    document.removeEventListener('keydown', handleResponse);
                    
                    const rt = Date.now() - trialStart;
                    const correct = e.key === trial.correct_response;
                    
                    accuracyWindow.push(correct ? 1 : 0);
                    const accuracy = calculateRollingAccuracy();

                    allData.push({
                        participant: participantId,
                        session: sessionId,
                        task: 'learning',
                        trial: currentLearningTrial + 1,
                        left_item: SHAPES[trial.left_item].name,
                        right_item: SHAPES[trial.right_item].name,
                        correct_response: trial.correct_response,
                        participant_response: e.key,
                        correct: correct,
                        rt: rt,
                        rolling_accuracy: accuracy
                    });
                    
                    currentLearningTrial++;
                    showFeedback(correct);
                }
            }
            
            document.addEventListener('keydown', handleResponse);
        }
        
        function showFeedback(correct) {
            const feedbackClass = correct ? 'feedback-correct' : 'feedback-incorrect';
            const feedbackText = correct ? 'Correct !' : 'Incorrect';
            
            showScreen(`
                <div>
                    <div class="${feedbackClass}">${feedbackText}</div>
                    <p style="color: white; margin-top: 80px; font-size: 20px;">Appuyez sur <strong>ESPACE</strong> pour continuer</p>
                </div>
            `);
            
            function spaceFeedback(e) {
                if (e.key === ' ') {
                    document.removeEventListener('keydown', spaceFeedback);
                    showFixation(() => showLearningTrial());
                }
            }
            document.addEventListener('keydown', spaceFeedback);
        }
        
        function showLearningComplete() {
            const accuracy = calculateRollingAccuracy();

            // Sauvegarde intermédiaire des données d'apprentissage
            const dataRef = database.ref('participants/' + participantId + '/learning');
            dataRef.set({ trials: allData.filter(d => d.task === 'learning') })
                .catch(err => console.error("Erreur sauvegarde learning:", err));
            
            showScreen(`
                <div class="block-feedback">
                    <h2>Bravo !</h2>
                    <p>Vous avez atteint ${(accuracy * 100).toFixed(0)}% de réussite.</p>
                    <p>La phase d'apprentissage est terminée !</p>
                    <br>
                    <p>Appuyez sur <strong>ESPACE</strong> pour continuer vers la phase de test</p>
                </div>
            `);
            
            document.addEventListener('keydown', function spaceNext(e) {
                if (e.key === ' ') {
                    document.removeEventListener('keydown', spaceNext);
                    showTestInstructions();
                }
            });
        }
        
        // ====================================================================
        // PHASE DE TEST
        // ====================================================================
        
        function showTestInstructions() {
            const referenceShapeHTML = createShapeHTML(2);
            const referenceName = SHAPES[2].name;
            
            showScreen(`
                <div class="instruction-text">
                    <h2>PHASE DE TEST : INSTRUCTIONS GENERALES</h2>
                    <p>Vous allez maintenant passer à la phase de test, composée de 4 blocs.</p>
                    <div style="text-align: center; margin: 5px 0;">
                        <p style="font-size: 20px; margin-bottom: 0px;">Forme de référence :</p>
                        <div style="display: flex; justify-content: center; height: 160px; align-items: center;">
                            ${referenceShapeHTML}
                        </div>
                    <p>Cette forme est votre référence — elle restera la même pendant toute l'expérience.
                    <p>À chaque essai, vous verrez apparaître <span class="jaune">une forme OU une flèche</span> (← ou →).</p>
                    <br>
                    <p style="text-align: center;">Votre tâche : appuyer sur <span class="jaune">ESPACE</span> si la forme/flèche correspond à la règle qui vous sera indiquée en début de bloc, <span class="jaune">SINON NE FAITES RIEN.</span></p>
                    <br>
                    <p>La règle change à chaque bloc, mais elle garde toujours la même structure :</p>
                    <br>
                    <p style="text-align: center;">"Appuyez sur ESPACE si la forme GAGNE ou PERD face à la référence,</p> 
                    <p style="text-align: center;">OU si la flèche pointe vers la GAUCHE ou la DROITE. Sinon, ne faites RIEN."</p>
                    <br>
                    <p>Attention : vous disposez de <strong><span class="jaune">2 secondes maximum pour répondre</span></strong> ! Passé ce délai, l'essai suivant démarre automatiquement.</p>
                    <br>
                    <p style="text-align: center;">Appuyez sur <strong>ESPACE</strong> pour continuer vers l'entraînement</p>
                </div>
            `);
            
            document.addEventListener('keydown', function spaceTestStart(e) {
                if (e.key === ' ') {
                    document.removeEventListener('keydown', spaceTestStart);
                    showPracticeBlock(ruleOrder[0], () => {
                        currentBlock = 0;
                        startTestBlock();
                    });
                }
            });
        }  
        
        
        function startTestBlock() {
            if (currentBlock >= TEST_BLOCKS) {
                showExperimentComplete();
                return;
            }
            
            const ruleCondition = ruleOrder[currentBlock];
            const rule = RESPONSE_RULES[ruleCondition];
            const referenceShapeHTML = createShapeHTML(2);
            
            showScreen(`
                <div class="instruction-text">
                    <h2>BLOC ${currentBlock + 1} sur ${TEST_BLOCKS}</h2>
                    <div style="text-align: center; margin: 5px 0;">
                        <p style="font-size: 20px; margin-bottom: 0px;">Forme de référence :</p>
                        <div style="display: flex; justify-content: center; height: 160px; align-items: center;">
                            ${referenceShapeHTML}
                        </div>
                    </div>
                    <br>
                    <p style="font-size: 20px; text-align: center;">${rule.instruction}</p>
                    <br>
                    <p>Rappel : vous disposez de <strong><span class="jaune">2 secondes maximum</span></strong> pour répondre</p>
                    <br>
                    <p style="text-align: center;">Appuyez sur <strong>ESPACE</strong> lorsque vous êtes prêt(e) à commencer</p>
                </div>
            `);
            
            document.addEventListener('keydown', function spaceBlockStart(e) {
                if (e.key === ' ') {
                    document.removeEventListener('keydown', spaceBlockStart);
                    testTrials = createTestTrials(ruleCondition);
                    currentTestTrial = 0;
                    showFixation(() => showTestTrial(ruleCondition));
                }
            });
        }
        
        function showTestTrial(ruleCondition) {
            if (currentTestTrial >= testTrials.length) {
                showBlockFeedback();
                return;
            }
            
            const trial = testTrials[currentTestTrial];
            showScreen(createSingleStimulusHTML(trial.stimulus_type, trial.stimulus_idx));
            
            const trialStart = Date.now();
            let responded = false; 
            
            function handleResponse(e) {
                if (e.key === ' ' && !responded) {
                    responded = true;
                    document.removeEventListener('keydown', handleResponse);
                    
                    const rt = Date.now() - trialStart;
                    const validRt = rt >= RT_MIN && rt <= RT_MAX;
                    const correct = trial.correct_response === 'go';
                    const errorType = correct ? 'none' : 'commission';
                    
                    allData.push({
                        participant: participantId,
                        session: sessionId,
                        task: 'test',
                        block: currentBlock + 1,
                        rule_condition: ruleCondition,
                        trial: currentTestTrial + 1,
                        stimulus_type: trial.stimulus_type,
                        stimulus_idx: trial.stimulus_idx,
                        magnitude: trial.magnitude,
                        congruency: trial.congruency,
                        correct_response: trial.correct_response,
                        participant_response: 'go',
                        correct: correct,
                        error_type: errorType,
                        rt: rt,
                        valid_rt: validRt
                    });
                    
                    currentTestTrial++;
                    setTimeout(() => showFixation(() => showTestTrial(ruleCondition)), 300);
                }
            }
            
            document.addEventListener('keydown', handleResponse);
            
            setTimeout(() => {
                if (!responded) {
                    document.removeEventListener('keydown', handleResponse);
                    
                    const correct = trial.correct_response === 'nogo';
                    const errorType = correct ? 'none' : 'omission';
                    
                    allData.push({
                        participant: participantId,
                        session: sessionId,
                        task: 'test',
                        block: currentBlock + 1,
                        rule_condition: ruleCondition,
                        trial: currentTestTrial + 1,
                        stimulus_type: trial.stimulus_type,
                        stimulus_idx: trial.stimulus_idx,
                        magnitude: trial.magnitude,
                        congruency: trial.congruency,
                        correct_response: trial.correct_response,
                        participant_response: 'nogo',
                        correct: correct,
                        error_type: errorType,
                        rt: null,
                        valid_rt: false
                    });
                    
                    currentTestTrial++;
                    setTimeout(() => showFixation(() => showTestTrial(ruleCondition)), 300);
                }
            }, STIMULUS_DURATION);
        }
        
        function showBlockFeedback() {
            const blockNum = currentBlock + 1;
            const ruleCondition = ruleOrder[currentBlock];
        
            // Sauvegarde intermédiaire existante
            const dataToSave = {
                participant_id: participantId,
                session_id: sessionId,
                timestamp: new Date().toISOString(),
                rule_order: ruleOrder,
                experiment_duration: Date.now() - window.experimentStartTime,
                trials: allData.filter(d => d.task === 'test' && d.block === blockNum)
            };
            database.ref('participants/' + participantId + '/bloc_' + blockNum)
                .set(dataToSave)
                .catch(err => console.error("Erreur sauvegarde intermédiaire:", err));
        
            const blockData = allData.filter(d => d.task === 'test' && d.block === blockNum);
            const accuracy = blockData.filter(d => d.correct).length / blockData.length;
            const validRts = blockData.filter(d => d.rt !== null && d.valid_rt).map(d => d.rt);
            const meanRt = validRts.length > 0
                ? validRts.reduce((a, b) => a + b, 0) / validRts.length
                : 0;
        
            // 1. Sauvegarde du score dans le nœud partagé
            database.ref('block_scores/block_' + blockNum + '/' + participantId)
                .set(accuracy)
                .then(() => {
                    // 2. Lit tous les scores du bloc pour calculer le percentile
                    return database.ref('block_scores/block_' + blockNum).once('value');
                })
                .then(snapshot => {
                    const allScores = [];
                    snapshot.forEach(child => allScores.push(child.val()));
        
                    const others = allScores.filter(s => s !== accuracy || allScores.indexOf(s) !== allScores.lastIndexOf(s));
                    // Plus robuste : on retire juste notre propre score une fois
                    const otherScores = [...allScores];
                    const myIdx = otherScores.indexOf(accuracy);
                    if (myIdx !== -1) otherScores.splice(myIdx, 1);
        
                    let percentileHTML = '';
                    if (otherScores.length === 0) {
                        percentileHTML = '';
                    } else {
                        const below = otherScores.filter(s => s < accuracy).length;
                        const above = otherScores.filter(s => s > accuracy).length;
                        const percentileBetter = Math.round((below / otherScores.length) * 100);
                        const percentileWorse = Math.round((above / otherScores.length) * 100);
        
                        if (percentileBetter >= 50) {
                            percentileHTML = `<p style="color: #FFE066;">🏅 Vous êtes dans le <strong>top ${100 - percentileBetter}%</strong> des participant·e·s sur ce bloc - continuez comme ça ! </p>`;
                        } else {
                            percentileHTML = `<p style="color: #FFAA44;">📊 Vous êtes dans le <strong>top ${100 - percentileBetter}%</strong> des participant·e·s sur ce bloc — continuez vos efforts ! </p>`;
                        }
                    }
        
                    showScreen(`
                        <div class="block-feedback">
                            <h2>Bloc ${blockNum} terminé !</h2>
                            <br>
                            <p>Précision : ${(accuracy * 100).toFixed(1)}%</p>
                            <br>
                            ${percentileHTML}
                            <br>
                            ${blockNum < TEST_BLOCKS
                                ? '<p>Appuyez sur <strong>ESPACE</strong> pour continuer</p>'
                                : '<p>Appuyez sur <strong>ESPACE</strong> pour terminer</p>'}
                        </div>
                    `);
        
                    document.addEventListener('keydown', function spaceNextBlock(e) {
                        if (e.key === ' ') {
                            document.removeEventListener('keydown', spaceNextBlock);
                            currentBlock++;
                            startTestBlock();
                        }
                    });
                })
                .catch(err => {
                    console.error("Erreur ranking:", err);
                    // Fallback sans ranking si Firebase échoue
                    showScreen(`
                        <div class="block-feedback">
                            <h2>Bloc ${blockNum} terminé !</h2>
                            <br>
                            <p>Précision : ${(accuracy * 100).toFixed(1)}%</p>
                            <br>
                            ${blockNum < TEST_BLOCKS
                                ? '<p>Appuyez sur <strong>ESPACE</strong> pour continuer</p>'
                                : '<p>Appuyez sur <strong>ESPACE</strong> pour terminer</p>'}
                        </div>
                    `);
                    document.addEventListener('keydown', function spaceNextBlock(e) {
                        if (e.key === ' ') {
                            document.removeEventListener('keydown', spaceNextBlock);
                            currentBlock++;
                            startTestBlock();
                        }
                    });
                });
        }
        
        function showExperimentComplete() {
            // Sauvegarde automatiquement dans Firebase
            showDemographics();
        }
        
        // ====================================================================
        // DÉMARRAGE
        // ====================================================================
        
        window.onload = showParticipantInfo;
    </script>
</body>
</html>
